model_name: therahelix_joint
data:
  root: data/therapeutic_2025
  track: fine39
  features: features/esm2_650m
  peptide_features: features/esm2_peptide_150m
  augment: false
encoder:
  name: facebook/esm2_t33_650M_UR50D
  revision: 08e4846e537177426273712802403f7ba8261b6c
  max_length: 80
  batch_size: 8
peptide_encoder:
  name: jiahuizhang/esm-150m-peptide-fine-tune
  revision: 6d8cebf74c53b1032b6f5917e75e3253cb70f575
  max_length: 80
  batch_size: 8
model:
  branch_thresholds: [0.5, 0.64]
  theraset:
    dim: 256
    heads: 8
    cnn_channels: 128
    context_depth: 1
    property_depth: 1
    pair_dim: 32
    decoder_depth: 2
  helixset:
    dim: 384
    heads: 8
    sequence_depth: 3
    property_depth: 2
    geometry_depth: 4
    pair_dim: 48
    pair_depth: 4
    latent_count: 32
    latent_depth: 6
loss:
  unlabeled_weight: 0.3
  modality_dropout: 0.1
  theraset: 0.5
  helixset: 0.5
  theraset_direct: 0.1
  theraset_evidence: 0.05
train:
  device: cpu
  seed: 42
  epochs: 60
  batch_size: 4
  accumulation_steps: 16
  precision: fp32
  learning_rate: 0.0002
  weight_decay: 0.01
  patience: 15
  warmup_epochs: 5
  gradient_clip: 5
  num_workers: 0
  ema_decay: 0.999
  ema_start_epoch: 6
  metric_suite: jaccard
  threshold_strategy: global
  export_validation_predictions: true
  output: runs
