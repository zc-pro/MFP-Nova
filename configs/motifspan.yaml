# Main configuration; frozen single 650M and AA34.
model_name: motifspan
data:
  root: data/therapeutic_2025
  track: fine39
  features: features/esm2_650m
  augment: false
encoder:
  name: facebook/esm2_t33_650M_UR50D
  revision: 08e4846e537177426273712802403f7ba8261b6c
  max_length: 80
  batch_size: 8
model:
  dim: 256
  dropout: 0.2
  cnn_channels: 64
  relation_dim: 32
  max_spans: 8
  span_size: 6
  learned_spans: true
  relation_mode: conserved
  spatial: true
  detail_mode: conditional
loss:
  unlabeled_weight: 0.3
  rdrop: 0.1
train:
  device: cpu
  seed: 42
  epochs: 100
  batch_size: 64
  accumulation_steps: 1
  precision: fp32
  learning_rate: 0.0002
  weight_decay: 0.01
  patience: 15
  warmup_epochs: 5
  rdrop_start_epoch: 6
  rdrop_ramp_epochs: 5
  gradient_clip: 5
  num_workers: 0
  ema_decay: 0.999
  ema_start_epoch: 6
  metric_suite: traditional5
  threshold_strategy: global
  save_selection_candidates: true
  export_validation_predictions: true
  output: runs
