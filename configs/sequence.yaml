# ESM-2 35M comparison; use sequence_650m.yaml for the 650M experiment.
data:
  root: data/therapeutic_2025
  track: fine39
  augment: false
  features: features/esm2_35m
encoder:
  name: facebook/esm2_t12_35M_UR50D
  revision: main
  max_length: 80
  batch_size: 32
model:
  hidden_dim: 128
  kernels: [3, 5]
  channels: 64
  dropout: 0.1
  use_local: true
loss:
  name: asl
  gamma_pos: 0
  gamma_neg: 2
  clip: 0.03
train:
  device: cpu
  seed: 42
  epochs: 60
  batch_size: 128
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 10
  num_workers: 0
  output: runs
