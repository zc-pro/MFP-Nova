model_name: xbridge
data:
  root: data/therapeutic_2025
  track: fine39
  features: features/esm2_650m
  peptide_features: features/esm2_peptide_150m
  augment: false
encoder:
  name: facebook/esm2_t33_650M_UR50D
  revision: 08e4846e537177426273712802403f7ba8261b6c
  max_length: 80
  batch_size: 8
peptide_encoder:
  name: jiahuizhang/esm-150m-peptide-fine-tune
  revision: 6d8cebf74c53b1032b6f5917e75e3253cb70f575
  max_length: 80
  batch_size: 8
model:
  dim: 192
  dropout: 0.15
loss:
  unlabeled_weight: 0.3
  evidence_classification: 0.3
  axis_coverage: 0.0
  axis_temperature: 0.2
  bridge: 0.025
  bridge_margin: 0.5
train:
  device: cpu
  seed: 42
  epochs: 60
  batch_size: 16
  accumulation_steps: 4
  precision: fp32
  learning_rate: 0.0002
  esm_learning_rate: 0.0001
  weight_decay: 0.01
  patience: 12
  warmup_epochs: 3
  aux_warmup_epochs: 3
  gradient_clip: 5
  num_workers: 0
  metric_suite: jaccard
  xbridge_pair_batches: true
  export_validation_predictions: true
  output: runs
