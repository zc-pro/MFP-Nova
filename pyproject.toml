[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfp-nova"
version = "0.1.0"
description = "Lightweight research framework for multilabel therapeutic peptide prediction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3", "transformers>=4.44,<5", "scikit-learn>=1.4,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mfp-nova = "mfp_nova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
